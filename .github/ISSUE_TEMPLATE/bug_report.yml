name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here.** See the [security policy](https://github.com/martinezsaweczko/go-api-template/security/policy).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands or requests that trigger the bug.
      placeholder: |
        1. Run `make run`
        2. Send `curl -i http://localhost:8080/api/v1/health`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include status codes, logs or error output (redact secrets).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA (`GET /api/v1/version` or `git rev-parse --short HEAD`).
      placeholder: v1.2.3
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, and how the service runs (binary, Docker, Kubernetes).
      placeholder: |
        - OS/arch: linux/amd64
        - Go: 1.26.1
        - Runtime: Docker
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
