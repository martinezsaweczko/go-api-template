basePath: /api/v1
definitions:
  model.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.HTTPError:
    properties:
      message:
        type: string
    type: object
  model.HealthInfo:
    properties:
      status:
        type: string
      timestamp:
        type: string
    type: object
  model.OKResponse:
    properties:
      status:
        type: string
    type: object
  model.TokenRequest:
    properties:
      subject:
        type: string
    type: object
  model.TokenResponse:
    properties:
      token:
        type: string
    type: object
  model.VersionInfo:
    properties:
      appName:
        type: string
      buildTime:
        type: string
      version:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Production-ready Go API template.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Go API Template
  version: "1.0"
paths:
  /dummyBusinessLogic:
    get:
      consumes:
      - application/json
      description: Dummy business logic endpoint for testing purposes
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OKResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.HTTPError'
      security:
      - Bearer: []
      summary: Dummy business logic endpoint
      tags:
      - dummy
  /health:
    get:
      consumes:
      - application/json
      description: Get health status of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.HTTPError'
      summary: Get health status
      tags:
      - health
  /token:
    post:
      consumes:
      - application/json
      description: Generate a new JWT token with the given subject
      parameters:
      - description: Token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Create JWT token
      tags:
      - auth
  /version:
    get:
      consumes:
      - application/json
      description: Get version information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.VersionInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.HTTPError'
      summary: Get version information
      tags:
      - version
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
